services:
  - type: web
    name: pentavault
    env: python
    buildCommand: "pip install -r requirements.txt && playwright install --with-deps chromium && cd scanner/web/frontend && npm install && npm run build && rm -rf ../static/* && cp -r dist/* ../static/"
    startCommand: "uvicorn scanner.web.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PENTAVAULT_FRONTEND_MODE
        value: react
